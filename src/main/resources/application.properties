spring.application.name=panic-button-service
server.port=8001

# Shared PostgreSQL database (maintained across both services)
spring.datasource.url=jdbc:postgresql://localhost:5432/emergency_alert
spring.datasource.username=postgres
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger / OpenAPI (paths mirror the FastAPI service)
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.url=/api/v1/openapi.json
springdoc.api-docs.path=/api/v1/openapi.json

# Application environment (reported by /ready)
app.environment=production

# JWT
jwt.secret=dev-secret-change-me-please-32-bytes-minimum-secret-key
jwt.expiration-minutes=1440

# External middleware
middleware.base-url=http://localhost:5000
middleware.service-token=dev-service-token
middleware.retry.max-attempts=3
middleware.retry.backoff-ms=500
